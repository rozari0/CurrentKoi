<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{% endblock %} - Current Koi</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="min-h-screen bg-white text-neutral-950 antialiased">

  <main class="relative flex min-h-screen flex-col overflow-hidden">

    <!-- Navbar -->
    <header class="relative z-20 w-full px-6 py-5 md:px-[4%]">
      <nav class="flex items-center justify-between gap-5">

        <!-- Logo -->
        <a href="{% url 'home' %}" aria-label="Homepage" class="brand-mark shrink-0">
          <svg
            width="27"
            height="27"
            viewBox="0 0 28 28"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M21 7A10 10 0 1 0 21 21"
              stroke="currentColor"
              stroke-width="3.2"
              stroke-linecap="round"
            />
          </svg>
          <span class="brand-wordmark">Current Koi</span>
        </a>


        <!-- Actions -->
        <div class="flex items-center gap-2.5">
          <a
            href="{% url 'flash' %}"
            class="rounded-xl border border-neutral-200 px-4 py-2.5 text-sm font-medium transition hover:bg-neutral-100"
          >
            Flash
          </a>

          {% if user.is_authenticated %}
            <a
              href="{% url 'dashboard' %}"
              class="rounded-xl bg-neutral-950 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-neutral-700"
            >
              Dashboard
            </a>
          {% else %}
            <a
              href="{% url 'account_login' %}"
              class="rounded-xl border border-neutral-200 px-4 py-2.5 text-sm font-medium transition hover:bg-neutral-100"
            >
              Sign in
            </a>

            <a
              href="{% url 'account_signup' %}"
              class="rounded-xl bg-neutral-950 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-neutral-700"
            >
              Get started
            </a>
          {% endif %}
        </div>
      </nav>
    </header>

    <div class="container mx-auto flex flex-1 flex-col items-center justify-center px-6 py-12 md:px-[4%]">
      {% if messages %}
        <div class="w-full max-w-md">
          {% for message in messages %}
            <div class="mb-3 rounded-xl border px-4 py-3 text-sm
              {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-700
              {% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-700
              {% else %}border-neutral-200 bg-neutral-50 text-neutral-600{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}
      {% endblock %}
    </div>
      

    
  </main>
</body>
</html>
