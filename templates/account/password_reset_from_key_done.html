{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %}{% endblock %}

{% block content %}
<div class="w-full max-w-md">
  <div class="rounded-2xl border border-neutral-200 bg-white p-8 text-center sm:p-10">
    <div class="mx-auto flex h-11 w-11 items-center justify-center rounded-full border border-emerald-200 bg-emerald-50 text-emerald-600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h1 class="mt-4 text-2xl font-semibold tracking-tight text-neutral-950">{% trans "Password updated" %}</h1>
    <p class="mt-2 text-sm leading-relaxed text-neutral-500">
      {% trans "Your password has been changed. You can now sign in with your new password." %}
    </p>
    <a href="{% url 'account_login' %}" class="btn btn-primary mt-6 w-full">
      {% trans "Sign In" %}
    </a>
  </div>
</div>
{% endblock %}
